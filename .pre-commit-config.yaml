repos:
  - repo: local
    hooks:
      - id: golangci-lint-full
        name: golangci-lint-full
        language: system
        # Uses golangci-lint from PATH (pin v2.12.2 — see .github/workflows).
        # GOWORK=off guards against a stray go.work in a parent dir making
        # typechecking fail with "directory prefix . does not contain modules
        # listed in go.work".
        entry: env GOWORK=off golangci-lint run
        types: [go]
        pass_filenames: false
