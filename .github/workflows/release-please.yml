name: release-please

# Conventional-commit-driven versioning ONLY (tag + GitHub release +
# changelog). Binary/image builds are intentionally not part of this
# workflow — deploys are handled externally via the release webhook.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
