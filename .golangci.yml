version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: cognitive-complexity
          arguments: [20]
        - name: cyclomatic
          arguments: [15]
        - name: function-length
          arguments: [100, 60]
